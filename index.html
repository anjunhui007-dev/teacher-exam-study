<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Exam Study</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/extra.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-wrap">
        <button id="homeBtn" class="brand-button" aria-label="홈으로 이동">
          <span class="brand-mark">T</span>
          <span><strong>Teacher Exam Study</strong><small>초등임용 교육과정 학습</small></span>
        </button>
      </div>
      <div class="header-actions">
        <button id="weaknessBtn" class="ghost-btn weakness-header-btn">약점 보충 <span id="weaknessBadge" class="badge hidden">0</span></button>
        <button id="importBtn" class="ghost-btn">과목별 자료 업로드</button>
        <button id="settingsBtn" class="ghost-btn">설정</button>
      </div>
    </header>
    <nav id="subjectBar" class="subject-bar" aria-label="과목 선택"></nav>
    <nav id="sectionBar" class="section-bar" aria-label="세부 영역 선택"></nav>
    <main id="appMain" class="app-main"></main>
  </div>

  <dialog id="importDialog" class="settings-dialog">
    <form method="dialog" id="importForm">
      <div class="dialog-header">
        <div><h2>과목별 자료 업로드</h2><p>이 채팅에서 변환한 JSON 파일을 원하는 과목에 넣을 수 있습니다.</p></div>
        <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
      </div>
      <section class="settings-section">
        <label class="upload-label">업로드할 과목
          <select id="importSubject"></select>
        </label>
        <label class="upload-drop" for="importFile">
          <strong>JSON 파일 선택</strong>
          <span>원문 · 표 · 강조 정보가 포함된 앱 전용 파일</span>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </label>
        <div id="selectedFileName" class="selected-file">아직 선택된 파일이 없습니다.</div>
      </section>
      <div class="dialog-actions"><button value="cancel" class="ghost-btn">취소</button><button id="doImportBtn" type="button" class="primary-btn">선택 과목에 업로드</button></div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="settings-dialog settings-wide">
    <form method="dialog" id="settingsForm">
      <div class="dialog-header"><div><h2>학습 설정</h2><p>상단 과목과 실제 공부할 영역을 원하는 대로 선택하세요.</p></div><button class="icon-btn" value="cancel" aria-label="닫기">×</button></div>
      <section class="settings-section"><h3>상단 과목 바</h3><p class="muted">체크한 과목만 상단 바에 표시됩니다.</p><div id="subjectSettings" class="subject-setting-list"></div></section>
      <section class="settings-section"><h3>과목별 학습 영역</h3><p class="muted">체크한 영역만 두 번째 바에 표시되고 회독 범위에도 포함됩니다.</p><div id="areaSettings" class="area-settings"></div></section>
      <section class="settings-section"><h3>타이핑 채점</h3><label class="radio-row"><input type="radio" name="gradingMode" value="flexible" /> 유연 채점 <span>띄어쓰기·문장부호 차이 허용</span></label><label class="radio-row"><input type="radio" name="gradingMode" value="strict" /> 엄격 채점 <span>원문과 동일해야 정답</span></label><label class="radio-row"><input type="radio" name="gradingMode" value="self" /> 직접 확인 <span>정답을 보고 내가 판정</span></label></section>
      <section class="settings-section"><h3>AI API</h3><p class="muted">현재는 설정 자리만 준비되어 있고 실제 호출은 비활성화되어 있습니다.</p><select id="aiProvider"><option value="none">사용 안 함</option><option value="openai">OpenAI</option><option value="gemini">Google Gemini</option></select></section>
      <div class="dialog-actions"><button value="cancel" class="ghost-btn">취소</button><button id="saveSettingsBtn" type="button" class="primary-btn">저장</button></div>
    </form>
  </dialog>
  <script type="module" src="./js/app-v4.js"></script>
</body>
</html>
