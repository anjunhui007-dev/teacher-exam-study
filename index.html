<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Exam Study</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/extra.css" />
  <link rel="stylesheet" href="./css/v5.css" />
  <link rel="stylesheet" href="./css/semantic.css" />
  <link rel="stylesheet" href="./css/v6.css?v=6.5.0" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-wrap">
        <button id="homeBtn" class="brand-button" aria-label="홈으로 이동">
          <span class="brand-mark">T</span>
          <span><strong>Teacher Exam Study</strong><small>초등임용 교육과정 학습</small></span>
        </button>
      </div>
      <div class="header-actions">
        <button id="weaknessBtn" class="ghost-btn weakness-header-btn">약점 보충 <span id="weaknessBadge" class="badge hidden">0</span></button>
        <button id="settingsBtn" class="ghost-btn">설정</button>
      </div>
    </header>
    <nav id="subjectBar" class="subject-bar" aria-label="과목 선택"></nav>
    <nav id="sectionBar" class="section-bar" aria-label="세부 영역 선택"></nav>
    <main id="appMain" class="app-main"></main>
  </div>

  <dialog id="importDialog" class="settings-dialog">
    <form method="dialog" id="importForm">
      <div class="dialog-header">
        <div><h2 id="importDialogTitle">자료 업로드</h2><p id="importDialogText">현재 과목에 JSON 자료를 병합합니다.</p></div>
        <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
      </div>
      <section class="settings-section">
        <label class="upload-drop" for="importFile">
          <strong>JSON 파일 선택</strong>
          <span>원문 · 표 · 강조 · 검토 필요 항목을 포함할 수 있습니다.</span>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </label>
        <div id="selectedFileName" class="selected-file">아직 선택된 파일이 없습니다.</div>
      </section>
      <div class="dialog-actions"><button value="cancel" class="ghost-btn">취소</button><button id="doImportBtn" type="button" class="primary-btn">현재 과목에 업로드</button></div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="settings-dialog settings-wide">
    <form method="dialog" id="settingsForm">
      <div class="dialog-header"><div><h2>학습 설정</h2><p>과목과 영역을 내 공부 범위에 맞게 구성하세요.</p></div><button class="icon-btn" value="cancel" aria-label="닫기">×</button></div>
      <section class="settings-section"><h3>상단 과목 바</h3><p class="muted">체크한 과목만 상단에 표시됩니다.</p><div id="subjectSettings" class="subject-setting-list"></div></section>
      <section class="settings-section"><h3>과목별 영역</h3><p class="muted">PDF/JSON에 존재하는 실제 영역을 자동으로 표시합니다. ‘표시’와 ‘회독/학습’ 범위를 각각 정할 수 있습니다.</p><div id="areaSettings" class="area-settings"></div></section>
      <section class="settings-section"><h3>빈칸 선택 방식</h3><p class="muted">체크하면 어절 끝의 조사만 빈칸에서 제외합니다. 예: ‘의사소통의’ → [의사소통]의</p><label class="toggle-row"><input id="particleSelectable" type="checkbox" /> <span><strong>조사 제외하기</strong><small>켬: 조사 제외 · 끔: 어절 전체를 빈칸으로</small></span></label></section>
      <section class="settings-section"><h3>타이핑 채점</h3>
        <label class="radio-row"><input type="radio" name="gradingMode" value="flexible" /> 유연 채점 <span>띄어쓰기·문장부호 차이 허용</span></label>
        <label class="radio-row"><input type="radio" name="gradingMode" value="strict" /> 엄격 채점 <span>원문과 동일해야 정답</span></label>
        <label class="radio-row"><input type="radio" name="gradingMode" value="self" /> 직접 확인 <span>정답 확인 후 내가 판정</span></label>
      </section>
      <section class="settings-section"><h3>AI API</h3><p class="muted">현재는 설정만 준비되어 있고 실제 호출은 비활성화되어 있습니다.</p><select id="aiProvider"><option value="none">사용 안 함</option><option value="openai">OpenAI</option><option value="gemini">Google Gemini</option></select></section>
      <div class="dialog-actions"><button value="cancel" class="ghost-btn">취소</button><button id="saveSettingsBtn" type="button" class="primary-btn">저장</button></div>
    </form>
  </dialog>

  <script type="module" src="./js/app-v5.js?v=6.5.0"></script>
  <script src="./js/ui-semantic-patch.js?v=6.5.0" defer></script>
  <script src="./js/cloze-v6-5.js?v=6.5.0" defer></script>
</body>
</html>
